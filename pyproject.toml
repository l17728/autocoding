[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autocoding-local"
version = "0.2.0"
description = "Local development-agent orchestration core"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
workbench = ["fastapi==0.143.0", "uvicorn==0.54.0", "httpx==0.28.1", "websockets==17.2", "pywinpty==3.0.5; sys_platform == 'win32'", "tzdata>=2024.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autocoding = ["data/*.json", "data/*.txt"]
